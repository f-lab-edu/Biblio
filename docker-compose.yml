services:
  db:
    build:
      context: ./infra/e2e-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "55433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migration:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    env_file:
      - ./services/core-api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  managed-embedding-endpoint:
    build:
      context: ./services/managed-embedding-endpoint
    env_file:
      - ./services/managed-embedding-endpoint/.env
    environment:
      MODEL_ARTIFACT_PATH: ${EMBEDDING_MODEL_ARTIFACT_PATH:-BAAI/bge-m3}
      PORT: "8000"
      MODEL_CACHE_DIR: /home/appuser/.cache/huggingface
    ports:
      - "8081:8000"
    volumes:
      - embedding-model-cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    env_file:
      - ./services/core-api/.env
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOOGLE_APPLICATION_CREDENTIALS: /creds/adc.json
      FIP_FEEDBACK_DELIVERY_URL: http://feedback-ingestion-pipeline:8080/feedback/events
    ports:
      - "8080:8080"
    volumes:
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      feedback-ingestion-pipeline:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pipeline-worker:
    build:
      context: ./services/pipeline-worker
    env_file:
      - ./services/pipeline-worker/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMBEDDING_API_URL: http://managed-embedding-endpoint:8000
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-BAAI/bge-m3}
      GOOGLE_APPLICATION_CREDENTIALS: /creds/adc.json
    volumes:
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      managed-embedding-endpoint:
        condition: service_healthy

  feedback-ingestion-pipeline:
    build:
      context: ./services/feedback-ingestion-pipeline
    env_file:
      - ./services/feedback-ingestion-pipeline/.env
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCS_FEEDBACK_LOG_BUCKET_NAME: ${GCS_FEEDBACK_LOG_BUCKET_NAME}
      GOOGLE_APPLICATION_CREDENTIALS: /creds/adc.json
      FIP_HTTP_ADDRESS: 0.0.0.0:8080
      FIP_HTTP_PATH: /feedback/events
      FIP_METRICS_ADDRESS: 0.0.0.0:9598
    ports:
      - "18080:8080"
      - "19598:9598"
    volumes:
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    restart: unless-stopped

  feedback-loop-scheduler:
    build:
      context: ./services/feedback-loop-pipeline
    environment: &feedback-loop-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BROKER_TYPE: pgmq
      RAW_FEEDBACK_LOG_PREFIX: feedback/raw_logs
      DATASET_ARTIFACT_PREFIX: feedback/datasets
      MODEL_ARTIFACT_PREFIX: feedback/model-artifacts
      MODEL_VERSION_PREFIX: bge-m3
      SERVING_MODEL_ARTIFACT_PREFIX: models
      EVALUATION_ARTIFACT_PREFIX: feedback/evaluations
      ARTIFACT_STORE_BACKEND: gcs
      GCS_FEEDBACK_LOG_BUCKET_NAME: ${GCS_FEEDBACK_LOG_BUCKET_NAME}
      GOOGLE_APPLICATION_CREDENTIALS: /creds/adc.json
      LOCAL_ARTIFACT_ROOT: /var/lib/feedback-loop/artifacts
      BATCH_EMBEDDING_ENDPOINT_URL: http://managed-embedding-endpoint:8000
      SEARCH_EMBEDDING_ENDPOINT_URL: http://managed-embedding-endpoint:8000
      SEARCH_SERVICE_URL: http://search-service:8082
      LOCAL_TRAINING_MODEL_NAME: ${EMBEDDING_MODEL_VERSION:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      TRAINING_CONFIG_PATH: configs/training/local-smoke.yaml
      EVALUATION_DATASET_REF: feedback/evaluation/evaluation_dataset.json
      FEEDBACK_DATASET_QUEUE_NAME: feedback.dataset
      FEEDBACK_TRAINING_QUEUE_NAME: feedback.training
      FEEDBACK_ROLLBACK_QUEUE_NAME: feedback.rollback.high
      FEEDBACK_REEMBEDDING_QUEUE_NAME: feedback.reembedding
      CANDIDATE_DEPLOYMENT_MAX_ATTEMPTS: 5
    volumes:
      - feedback-loop-artifacts:/var/lib/feedback-loop/artifacts
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on: &feedback-loop-depends
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      managed-embedding-endpoint:
        condition: service_healthy
      feedback-ingestion-pipeline:
        condition: service_started
    command: ["python", "-m", "src.main"]
    restart: unless-stopped

  feedback-loop-dataset-worker:
    build:
      context: ./services/feedback-loop-pipeline
    environment:
      <<: *feedback-loop-env
      APP_ROLE: dataset-worker
    volumes:
      - feedback-loop-artifacts:/var/lib/feedback-loop/artifacts
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on: *feedback-loop-depends
    command: ["python", "-m", "src.main"]
    restart: unless-stopped

  feedback-loop-train-release-worker:
    build:
      context: ./services/feedback-loop-pipeline
    environment:
      <<: *feedback-loop-env
      APP_ROLE: train-release-worker
    volumes:
      - feedback-loop-artifacts:/var/lib/feedback-loop/artifacts
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on: *feedback-loop-depends
    command: ["python", "-m", "src.main"]
    restart: unless-stopped

  feedback-loop-rollback-worker:
    build:
      context: ./services/feedback-loop-pipeline
    environment:
      <<: *feedback-loop-env
      APP_ROLE: rollback-worker
      WORKER_POLL_INTERVAL_SEC: "1"
    volumes:
      - feedback-loop-artifacts:/var/lib/feedback-loop/artifacts
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on: *feedback-loop-depends
    command: ["python", "-m", "src.main"]
    restart: unless-stopped

  feedback-loop-legacy-reindex-worker:
    build:
      context: ./services/feedback-loop-pipeline
    environment:
      <<: *feedback-loop-env
      APP_ROLE: legacy-reindex-worker
    volumes:
      - feedback-loop-artifacts:/var/lib/feedback-loop/artifacts
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on: *feedback-loop-depends
    command: ["python", "-m", "src.main"]
    restart: unless-stopped

  feedback-loop-reembedding-worker:
    build:
      context: ./services/feedback-loop-pipeline
    environment:
      <<: *feedback-loop-env
      APP_ROLE: reembedding-worker
    volumes:
      - feedback-loop-artifacts:/var/lib/feedback-loop/artifacts
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on: *feedback-loop-depends
    command: ["python", "-m", "src.main"]
    restart: unless-stopped

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    env_file:
      - ./services/search-service/.env
    environment:
      PORT: "8082"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMBEDDING_API_URL: http://managed-embedding-endpoint:8000
      GOOGLE_APPLICATION_CREDENTIALS: /creds/adc.json
    ports:
      - "8082:8082"
    volumes:
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      managed-embedding-endpoint:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
  embedding-model-cache:
  feedback-loop-artifacts:
