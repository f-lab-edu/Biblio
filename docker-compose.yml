services:
  db:
    build:
      context: ./infra/e2e-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "55433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migration:
    build:
      context: ./services/core-api
    env_file:
      - ./services/core-api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  managed-embedding-endpoint:
    build:
      context: ./services/managed-embedding-endpoint
    env_file:
      - ./services/managed-embedding-endpoint/.env
    environment:
      MODEL_ARTIFACT_PATH: ${EMBEDDING_MODEL_ARTIFACT_PATH:-BAAI/bge-m3}
      PORT: "8000"
      MODEL_CACHE_DIR: /home/appuser/.cache/huggingface
    ports:
      - "8081:8000"
    volumes:
      - embedding-model-cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  core-api:
    build:
      context: ./services/core-api
    env_file:
      - ./services/core-api/.env
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOOGLE_APPLICATION_CREDENTIALS: /creds/adc.json
    ports:
      - "8080:8080"
    volumes:
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pipeline-worker:
    build:
      context: ./services/pipeline-worker
    env_file:
      - ./services/pipeline-worker/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMBEDDING_API_URL: http://managed-embedding-endpoint:8000
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-BAAI/bge-m3}
      GOOGLE_APPLICATION_CREDENTIALS: /creds/adc.json
    volumes:
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      managed-embedding-endpoint:
        condition: service_healthy

  search-service:
    build:
      context: ./services/search-service
    env_file:
      - ./services/search-service/.env
    environment:
      PORT: "8082"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMBEDDING_API_URL: http://managed-embedding-endpoint:8000
      GOOGLE_APPLICATION_CREDENTIALS: /creds/adc.json
    ports:
      - "8082:8082"
    volumes:
      - ${ADC_CREDENTIALS_PATH}:/creds/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      managed-embedding-endpoint:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
  embedding-model-cache:
