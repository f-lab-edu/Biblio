[tool.poetry]
name = "biblio-core-api"
version = "0.1.0"
description = "Core API Server scaffold for the Biblio project"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
biblio-auth = { path = "../../packages/biblio-auth" }
fastapi = ">=0.111,<1.0"
PyJWT = ">=2.0,<3.0"
alembic = ">=1.13,<2.0"
asyncpg = ">=0.29,<1.0"
argon2-cffi = ">=23.1,<26.0"
email-validator = ">=2.0,<3.0"
google-cloud-storage = ">=2.0,<3.0"
loguru = ">=0.7,<1.0"
pydantic-settings = ">=2.3,<3.0"
sqlalchemy = { version = ">=2.0,<3.0", extras = ["asyncio"] }
uvicorn = { version = ">=0.29,<1.0", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
httpx = ">=0.27,<1.0"
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"
pytest-cov = ">=5.0,<6.0"
testcontainers = { version = ">=4.0,<5.0", extras = ["postgres"] }
poethepoet = ">=0.32,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poe.tasks]
test = "pytest tests -s"
cov = "pytest tests --cov=src --cov-report=term-missing --cov-fail-under=80 -s"
migrate = "alembic upgrade head"
check.sequence = ["migrate", "test", "cov"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
