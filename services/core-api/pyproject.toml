[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biblio-core-api"
version = "0.1.0"
description = "Core API Server scaffold for the Biblio project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1.0",
    "PyJWT>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "google-cloud-storage>=2.0,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
