[project]
name = "biblio-feedback-ingestion-pipeline"
version = "0.1.0"
description = "Vector-based feedback ingestion pipeline for Biblio"
authors = [{ name = "Biblio Team" }]
requires-python = ">=3.11,<4.0"
dependencies = [
  "loguru>=0.7,<1.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
poethepoet = ">=0.32,<1.0"
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<6.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poe.tasks.test]
cmd = "pytest tests -s"

[tool.poe.tasks.validate-vector]
cmd = "./scripts/validate_configs.sh"

[tool.poe.tasks.check]
sequence = ["test", "validate-vector"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
