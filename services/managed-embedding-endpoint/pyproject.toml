[tool.poetry]
name = "biblio-managed-embedding-endpoint"
version = "0.1.0"
description = "Biblio Managed Embedding Endpoint - Text embedding serving via BAAI/bge-m3"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.111,<1.0"
uvicorn = { version = ">=0.29,<1.0", extras = ["standard"] }
pydantic-settings = ">=2.3,<3.0"
httpx = ">=0.27,<1.0"
loguru = ">=0.7,<1.0"
asyncpg = ">=0.29,<1.0"
FlagEmbedding = "*"
transformers = ">=4.44.2,<5.0.0"
torch = { version = "==2.7.1", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"
pytest-cov = ">=5.0,<6.0"
poethepoet = ">=0.32,<1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.poe.tasks]
test = "pytest tests -s"
cov = "pytest tests --cov=src --cov-report=term-missing --cov-fail-under=80 -s"
