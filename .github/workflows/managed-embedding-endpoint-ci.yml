name: Managed Embedding Endpoint CI

on:
  pull_request:
    paths:
      - "services/managed-embedding-endpoint/**"
      - ".github/workflows/managed-embedding-endpoint-ci.yml"
  workflow_dispatch:

jobs:
  managed-embedding-endpoint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/managed-embedding-endpoint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run test suite
        run: poetry run poe test

      - name: Run coverage gate
        run: poetry run poe cov
