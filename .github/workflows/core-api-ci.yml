name: Core API CI

on:
  pull_request:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-ci.yml"
  workflow_dispatch:

jobs:
  core-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/core-api

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install

      - name: Verify Docker for Testcontainers
        run: docker version

      - name: Run Alembic migrations
        run: poetry run poe migrate

      - name: Run test suite
        run: poetry run poe test

      - name: Run coverage gate
        run: poetry run poe cov
