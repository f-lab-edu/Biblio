name: Core API CI

on:
  pull_request:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-ci.yml"
  workflow_dispatch:

jobs:
  core-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/core-api

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Docker for Testcontainers
        run: docker version

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run test suite
        run: pytest tests -s

      - name: Run coverage gate
        run: pytest tests --cov=src --cov-report=term-missing --cov-fail-under=80 -s
